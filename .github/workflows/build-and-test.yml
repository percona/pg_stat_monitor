name: Reusable build and test
on:
  workflow_call:
    inputs:
      pg_package:
        type: string
        required: true
      pg_version:
        type: string
        required: true
      os:
        type: string
        required: true
      compiler:
        type: string
        required: true
      build_type:
        type: string
        required: true
      container:
        description: >-
          Prebuilt CI image providing the dependencies and PostgreSQL.
          Empty string runs directly on the runner, as before.
        type: string
        required: false
        default: ''

env:
  PG_PACKAGE: ${{ inputs.pg_package }}
  PG_VERSION: ${{ inputs.pg_version }}
  OS: ${{ inputs.os }}
  CC: ${{ inputs.compiler }}
  BUILD_TYPE: ${{ inputs.build_type }}
  PGPORT: 6432
  # Container jobs run as root, but PostgreSQL refuses to run as root, so the
  # test step drops to the image's unprivileged `ci` user. Empty when running
  # directly on the runner, which is already unprivileged.
  RUN_AS: ${{ inputs.container != '' && 'run-as-ci' || '' }}

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    container: ${{ inputs.container }}
    timeout-minutes: 15
    steps:
      # The steps below are skipped when a prebuilt image supplies the
      # environment. The runner images ship PostgreSQL preinstalled, which is
      # what this purge exists for; the CI images never contain it.
      - name: Remove existing PostgreSQL
        if: inputs.container == '' && startsWith(inputs.os, 'ubuntu-')
        run: sudo apt purge postgresql* libpq*

      - name: Clone repository
        uses: actions/checkout@v7
        with:
          path: src
          ref: ${{ github.ref }}

      - name: Install dependencies for Ubuntu
        if: inputs.container == '' && startsWith(inputs.os, 'ubuntu-')
        run: src/.github/scripts/ubuntu-deps.sh

      - name: Install dev dependencies for Ubuntu
        if: inputs.container == '' && startsWith(inputs.os, 'ubuntu-') && env.PG_PACKAGE == 'source'
        run: src/.github/scripts/ubuntu-deps.sh dev

      # macOS runners cannot use containers, so this path is unchanged.
      - name: Install dependencies for MacOS
        if: startsWith(inputs.os,  'macos-')
        run: src/.github/scripts/macos-deps.sh

      - name: Install PostgreSQL
        if: inputs.container == '' && env.PG_PACKAGE != 'source'
        run: src/.github/scripts/install-postgresql.sh ${{ env.PG_PACKAGE }} ${{ env.PG_VERSION }}

      - name: Clone postgres repository
        if: inputs.container == '' && env.PG_PACKAGE == 'source'
        uses: actions/checkout@v7
        with:
          path: postgres
          repository: postgres/postgres.git
          ref: REL_${{ env.PG_VERSION }}_STABLE

      - name: Build PostgreSQL
        if: inputs.container == '' && env.PG_PACKAGE == 'source'
        run: src/.github/scripts/build-postgres.sh ${{ env.BUILD_TYPE }}

      - name: Build pg_stat_monitor
        run: src/.github/scripts/build.sh ${{ env.BUILD_TYPE }}

      - name: Hand the workspace to the unprivileged user
        if: inputs.container != ''
        run: chown -R ci:ci "$GITHUB_WORKSPACE"

      - name: Run tests
        run: $RUN_AS src/.github/scripts/test.sh ${{ env.BUILD_TYPE }}

      - name: Report on test fail
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: log-test-${{ env.PG_PACKAGE }}-${{ env.PG_VERSION }}-${{ env.OS }}-${{ env.CC }}-${{ env.BUILD_TYPE }}
          path: |
            src/regression_install
            src/regression_install.log
            src/regression.diffs
            src/regression.out
            src/results
            src/t/results
            src/tmp_check
          retention-days: 3
