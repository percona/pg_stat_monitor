name: Reusable build and test
on:
  workflow_call:
    inputs:
      pg_package:
        type: string
        required: true
      pg_version:
        type: string
        required: true
      runs-on:
        type: string
        required: true
      image-os:
        type: string
        required: false
        default: ''
      compiler:
        type: string
        required: true
      build_type:
        type: string
        required: true

env:
  PG_PACKAGE: ${{ inputs.pg_package }}
  PG_VERSION: ${{ inputs.pg_version }}
  OS: ${{ inputs.runs-on }}
  BUILD_TYPE: ${{ inputs.build_type }}
  PGPORT: 6432

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runs-on }}
    container:
      image: >-
        ${{ inputs.image-os && format(
        'ghcr.io/percona-lab/pg_github_actions_images/{0}-{1}',
        inputs.pg_package == 'source'
        && format('postgres-source:pgdg-{0}-{1}-{2}', inputs.pg_version, inputs.compiler, inputs.build_type)
        || format('{0}:{1}', inputs.pg_package, inputs.pg_version),
        inputs.image-os) }}
      options: --init ${{ inputs.build_type == 'exec-backend' && '--security-opt seccomp=unconfined' || '' }}
    timeout-minutes: 15
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          path: src
          ref: ${{ github.ref }}

      - name: Install dependencies for MacOS
        if: startsWith(inputs.runs-on,  'macos-')
        run: src/.github/scripts/macos-deps.sh

      - name: Install PostgreSQL
        if: startsWith(inputs.runs-on, 'macos-')
        run: |
          brew install postgresql@${{ inputs.pg_version }}
          brew link postgresql@${{ inputs.pg_version }}

      - name: Build pg_stat_monitor
        run: src/.github/scripts/build.sh ${{ env.BUILD_TYPE }}

      - name: Run tests
        run: src/.github/scripts/test.sh ${{ env.BUILD_TYPE }}

      - name: Report on test fail
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: log-test-${{ env.PG_PACKAGE }}-${{ env.PG_VERSION }}-${{ env.OS }}-${{ inputs.compiler }}-${{ env.BUILD_TYPE }}
          path: |
            src/regression_install
            src/regression_install.log
            src/regression.diffs
            src/regression.out
            src/results
            src/t/results
            src/tmp_check
          retention-days: 3
