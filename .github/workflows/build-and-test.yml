name: Reusable build and test
on:
  workflow_call:
    inputs:
      pg_package:
        type: string
        required: true
      pg_version:
        type: string
        required: true
      os:
        type: string
        required: true
      compiler:
        type: string
        required: true
      build_type:
        type: string
        required: true
      container:
        description: >-
          Run in the prebuilt CI image (percona-lab/pg_github_actions_images)
          that provides the dependencies and PostgreSQL matching pg_package,
          pg_version, compiler and build_type. Otherwise PostgreSQL is
          installed on the runner.
        type: boolean
        required: false
        default: false

env:
  PG_PACKAGE: ${{ inputs.pg_package }}
  PG_VERSION: ${{ inputs.pg_version }}
  OS: ${{ inputs.os }}
  CC: ${{ inputs.compiler }}
  BUILD_TYPE: ${{ inputs.build_type }}
  PGPORT: 6432

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    container:
      # The image is the one matching the job's inputs, e.g. psp:18-ubuntu24.04
      # or postgres-source:pgdg-18-gcc-debugoptimized-ubuntu24.04, or none.
      image: >-
        ${{ inputs.container && format(
        'ghcr.io/percona-lab/pg_github_actions_images/{0}-ubuntu{1}',
        inputs.pg_package == 'source'
        && format('postgres-source:pgdg-{0}-{1}-{2}', inputs.pg_version, inputs.compiler, inputs.build_type)
        || format('{0}:{1}', inputs.pg_package, inputs.pg_version),
        fromJSON('{"ubuntu-22.04": "22.04", "ubuntu-24.04": "24.04", "ubuntu-24.04-arm": "24.04"}')[inputs.os]) || '' }}
      # EXEC_BACKEND requires ASLR to be turned off.
      options: ${{ inputs.build_type == 'exec-backend' && '--security-opt seccomp=unconfined' || '' }}
    timeout-minutes: 15
    steps:
      - name: Remove existing PostgreSQL
        if: ${{ !inputs.container && startsWith(inputs.os, 'ubuntu-') }}
        run: sudo apt purge postgresql* libpq*

      - name: Clone repository
        uses: actions/checkout@v7
        with:
          path: src
          ref: ${{ github.ref }}

      - name: Install dependencies for Ubuntu
        if: ${{ !inputs.container && startsWith(inputs.os, 'ubuntu-') }}
        run: src/.github/scripts/ubuntu-deps.sh

      - name: Install dependencies for MacOS
        if: startsWith(inputs.os,  'macos-')
        run: src/.github/scripts/macos-deps.sh

      - name: Install PostgreSQL
        if: ${{ !inputs.container }}
        run: src/.github/scripts/install-postgresql.sh ${{ env.PG_PACKAGE }} ${{ env.PG_VERSION }}

      - name: Build pg_stat_monitor
        run: src/.github/scripts/build.sh ${{ env.BUILD_TYPE }}

      - name: Run tests
        run: src/.github/scripts/test.sh ${{ env.BUILD_TYPE }}

      - name: Report on test fail
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: log-test-${{ env.PG_PACKAGE }}-${{ env.PG_VERSION }}-${{ env.OS }}-${{ env.CC }}-${{ env.BUILD_TYPE }}
          path: |
            src/regression_install
            src/regression_install.log
            src/regression.diffs
            src/regression.out
            src/results
            src/t/results
            src/tmp_check
          retention-days: 3
