name: PMM Integration
on:
  push:
    branches:
      - main
      - release-*
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      matrix:
        postgresql: [14, 15, 16, 17, 18]

    steps:
      - name: Clone PMM QA
        uses: actions/checkout@v7
        with:
          repository: percona/pmm-qa
          ref: main
          path: pmm-qa

      - name: Set TARGET_BRANCH variable
        run: |
          echo "TARGET_BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "PATH_TO_PMM_QA=$GITHUB_WORKSPACE/pmm-qa/qa-integration" >> "$GITHUB_ENV"

      - name: Run PMM Server
        run: docker run --detach --restart always -p 443:8443 -p 8081:8080 --name pmm-server -e PMM_ENABLE_TELEMETRY=0 perconalab/pmm-server:3-dev-latest

      - name: Setup PostgreSQL ${{ matrix.postgresql }} & PGSM
        working-directory: pmm-qa/qa-integration/pmm_qa
        run: |
          install -d -m 777 /tmp/backup_data
          ./pmm-framework/pmm-framework --database PDPGSQL=${{ matrix.postgresql }},PGSM_BRANCH="$TARGET_BRANCH"

      - name: Install npx dependencies
        working-directory: pmm-qa/e2e_tests
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run integration tests
        working-directory: pmm-qa/e2e_tests
        env:
          PMM_UI_URL: 'http://127.0.0.1:8081/'
        run: npx playwright test --grep '@pdpgsql-pmm-integration'

      - name: Collect pmm-agent logs
        if: failure()
        run: |
          mkdir -p ./pmm-qa/e2e_tests/output
          docker exec pdpgsql_pmm_${{ matrix.postgresql }}_1 cat /var/log/pmm-agent.log > ./pmm-qa/e2e_tests/output/pmm-agent.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: tests-artifact-pg${{ matrix.postgresql }}
          path: |
            ./pmm-qa/e2e_tests/output/
            ./pmm-qa/e2e_tests/playwright-report/
            ./pmm-qa/e2e_tests/test-results/
          if-no-files-found: ignore
