name: Check
on:
  pull_request:

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    container: ghcr.io/percona-lab/pg_github_actions_images/postgres-source:psp-18-gcc-debugoptimized-ubuntu24.04
    timeout-minutes: 5
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: src
          ref: ${{ github.ref }}

      - name: Build pg_stat_monitor
        run: src/.github/scripts/build.sh debug

      - name: Update typedefs
        run: src/.github/scripts/dump-typedefs.sh

      - name: Run pgindent
        run: src/.github/scripts/run-pgindent.sh --check --diff

      - name: Run pgperltidy
        run: src/.github/scripts/run-pgperltidy.sh --assert-tidy --standard-error-output

  license:
    name: License
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Check license headers
        uses: apache/skywalking-eyes/header@v0.9.0
        with:
          token: "" # Prevent comments
