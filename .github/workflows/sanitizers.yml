name: Sanitizers
on:
  pull_request:
  push:
    branches:
      - main

env:
  PG_VERSION: 18
  CC: clang
  LD: clang
  UBSAN_OPTIONS: log_path=${{ github.workspace }}/sanitize.log print_suppressions=0 print_stacktrace=1 print_summary=1 halt_on_error=1
  ASAN_OPTIONS: log_path=${{ github.workspace }}/sanitize.log print_suppressions=0 abort_on_error=1
  LSAN_OPTIONS: log_path=${{ github.workspace }}/sanitize.log print_suppressions=0 suppressions=${{ github.workspace }}/src/suppressions/lsan.supp
  ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-14
  # Avoid failures on slow recovery
  PGCTLTIMEOUT: 120
  PG_TEST_TIMEOUT_DEFAULT: 300

jobs:
  run:
    name: Run
    runs-on: ubuntu-22.04
    # Built from percona/postgres with the same sanitize flags build-postgres.sh
    # would have applied. Based on Ubuntu 22.04, which is where
    # /usr/bin/llvm-symbolizer-14 (pinned above) comes from.
    container: ghcr.io/percona-lab/pg_github_actions_images/postgres-source:psp-18-clang-sanitize
    timeout-minutes: 20
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          path: src

      - name: Build pg_stat_monitor
        run: src/.github/scripts/build.sh sanitize

      - name: Hand the workspace to the unprivileged user
        run: chown -R ci:ci "$GITHUB_WORKSPACE"

      - name: Run pg_stat_monitor tests
        run: run-as-ci src/.github/scripts/test.sh sanitize

      - name: Print sanitize logs
        if: ${{ !cancelled() }}
        run: cat sanitize.log.*

      - name: Report on test fail
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: sanitizers-testlog
          path: |
            sanitize.log.*
            src/regression_install
            src/regression_install.log
            src/regression.diffs
            src/regression.out
            src/results
            src/t/results
            src/tmp_check
          retention-days: 3
