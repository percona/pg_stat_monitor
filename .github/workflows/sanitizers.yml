name: Sanitizers
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CC: clang
  LD: clang
  # Avoid failures on slow recovery
  PGCTLTIMEOUT: 120
  PG_TEST_TIMEOUT_DEFAULT: 300

jobs:
  run:
    name: Run
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/percona-lab/pg_github_actions_images/postgres-source:psp-18-clang-sanitize-ubuntu24.04
      options: --init --ulimit stack=67108864:67108864
    timeout-minutes: 20
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          path: src

      - name: Configure sanitizers
        run: |
          {
            echo "UBSAN_OPTIONS=log_path=$GITHUB_WORKSPACE/sanitize.log print_suppressions=0 print_stacktrace=1 print_summary=1 halt_on_error=1"
            echo "ASAN_OPTIONS=log_path=$GITHUB_WORKSPACE/sanitize.log print_suppressions=0 abort_on_error=1"
            echo "LSAN_OPTIONS=log_path=$GITHUB_WORKSPACE/sanitize.log print_suppressions=0 suppressions=$GITHUB_WORKSPACE/src/suppressions/lsan.supp"
          } >> "$GITHUB_ENV"

      - name: Build pg_stat_monitor
        run: src/.github/scripts/build.sh sanitize

      - name: Run pg_stat_monitor tests
        run: src/.github/scripts/test.sh sanitize

      - name: Print sanitize logs
        if: ${{ !cancelled() }}
        run: cat sanitize.log.*

      - name: Report on test fail
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: sanitizers-testlog
          path: |
            sanitize.log.*
            src/regression_install
            src/regression_install.log
            src/regression.diffs
            src/regression.out
            src/results
            src/t/results
            src/tmp_check
          retention-days: 3
