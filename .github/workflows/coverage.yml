name: Code coverage
on:
  pull_request:
  push:
    branches:
      - main

env:
  PG_VERSION: 18
  PG_PACKAGE: psp
  # Avoid failures on slow recovery
  PGCTLTIMEOUT: 120
  PG_TEST_TIMEOUT_DEFAULT: 300

jobs:
  collect:
    name: Collect and upload
    runs-on: ubuntu-24.04
    # Percona Server for PostgreSQL is preinstalled in the image. The tag is
    # spelled out because the `env` context is not available here; keep it in
    # step with PG_VERSION above.
    container: ghcr.io/percona-lab/pg_github_actions_images/psp:18
    timeout-minutes: 20
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ github.ref }}

      - name: Build pg_stat_monitor
        run: .github/scripts/build.sh coverage

      # The container has no running PostgreSQL service to stop and no
      # /var/run/postgresql to re-own; test.sh puts its socket in /tmp.
      - name: Hand the workspace to the unprivileged user
        run: chown -R ci:ci "$GITHUB_WORKSPACE"

      - name: Run tests
        run: run-as-ci .github/scripts/test.sh

      - name: Upload coverage data to codecov.io
        uses: codecov/codecov-action@v7
        with:
          verbose: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Report on test fail
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: coverage-testlog
          path: |
            regression_install
            regression_install.log
            regression.diffs
            regression.out
            results
            t/results
            tmp_check
          retention-days: 3
