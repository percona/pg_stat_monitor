name: Code coverage
on:
  pull_request:
  push:
    branches:
      - main

env:
  # Avoid failures on slow recovery
  PGCTLTIMEOUT: 120
  PG_TEST_TIMEOUT_DEFAULT: 300

jobs:
  collect:
    name: Collect and upload
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/percona-lab/pg_github_actions_images/psp:18-ubuntu24.04
      options: --init
    timeout-minutes: 20
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ github.ref }}

      - name: Build pg_stat_monitor
        run: .github/scripts/build.sh coverage

      - name: Run tests
        run: .github/scripts/test.sh

      - name: Upload coverage data to codecov.io
        uses: codecov/codecov-action@v7
        with:
          verbose: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Report on test fail
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: coverage-testlog
          path: |
            regression_install
            regression_install.log
            regression.diffs
            regression.out
            results
            t/results
            tmp_check
          retention-days: 3
